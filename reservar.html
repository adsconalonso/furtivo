<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva tu Cita — Furtivo Barbería</title>
  <meta name="description" content="Agenda tu cita en Furtivo Barbería. Selecciona tu servicio, barbero y horario en segundos.">
  <meta name="robots" content="noindex">

  <!-- Open Graph para WhatsApp / redes sociales -->
  <meta property="og:title" content="Reserva tu Cita — Furtivo Barbería">
  <meta property="og:description" content="Agenda tu cita en segundos. Selecciona servicio, barbero y horario.">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css?v=FINAL2">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0a0a0a;
      font-family: var(--font-sans, 'Inter', sans-serif);
      color: #eee;
      overscroll-behavior: none;
    }

    /* Grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* Top bar */
    .booking-topbar {
      width: 100%;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      position: relative;
      z-index: 1;
    }
    .booking-topbar__logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    .booking-topbar__logo span { color: #C9A96E; }

    .booking-topbar__back {
      font-size: 0.8rem;
      color: #555;
      text-decoration: none;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .booking-topbar__back:hover { color: #C9A96E; }
    .booking-topbar__back::before { content: '← '; }

    /* Main card */
    .booking-page {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
    }
    .booking-standalone-card {
      width: 100%;
      max-width: 520px;
      background: #111;
      min-height: calc(100svh - 65px);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 600px) {
      .booking-topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: rgba(10,10,10,0.9);
        backdrop-filter: blur(10px);
      }
      .booking-page {
        padding: 100px 1rem 2rem;
        min-height: 100svh;
        align-items: flex-start;
      }
      .booking-standalone-card {
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.06);
        min-height: unset;
        overflow: hidden;
        box-shadow: 0 40px 80px rgba(0,0,0,0.5);
      }
    }

    .standalone-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      color: #fff;
      line-height: 1.1;
      padding: 1.75rem 1.75rem 0;
    }

    .standalone-timeline-wrap {
      padding: 1rem 1.75rem 0;
    }

    /* Footer sticky at bottom */
    .wizard-footer {
      position: sticky;
      bottom: 0;
    }
  </style>
</head>
<body>

  <div class="booking-topbar">
    <a href="index.html" class="booking-topbar__logo"><img src="assets/images/furtivo-logo-oficial.png?v=FINAL" alt="Furtivo Barbería"></a>
    <a href="index.html" class="booking-topbar__back">Volver al sitio</a>
  </div>

  <div class="booking-page">
    <div class="booking-standalone-card" id="standaloneBooking"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js?v=FINAL"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('standaloneBooking');

      // Parse the modal template to extract inner pieces
      const tmp = document.createElement('div');
      tmp.innerHTML = bookingModalHTML;

      const timeline  = tmp.querySelector('.wizard-timeline');
      const scroll    = tmp.querySelector('.booking-modal-scroll');
      const footer    = tmp.querySelector('.wizard-footer');

      // 1. Title
      const h1 = document.createElement('h1');
      h1.className = 'standalone-title';
      h1.textContent = 'Reserva tu lugar';
      card.appendChild(h1);

      // 2. Timeline
      if (timeline) {
        const tlWrap = document.createElement('div');
        tlWrap.className = 'standalone-timeline-wrap';
        tlWrap.appendChild(timeline);
        card.appendChild(tlWrap);
      }

      // 3. Wizard steps (scroll area)
      if (scroll) card.appendChild(scroll);

      // 4. Nav footer
      if (footer) card.appendChild(footer);

      // Boot wizard logic
      setupWizardLogic();
      goToStep(1);

      // Pre-select service from URL: ?service=corte, ?service=diamante, etc.
      const params = new URLSearchParams(window.location.search);
      const preService = params.get('service');
      if (preService) {
        const target = document.querySelector(`.service-card[data-service="${preService}"]`);
        if (target) {
          target.click();
          setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
        }
      }

      // Pre-select barber from URL: ?barber=fernando, ?barber=juan
      const preBarber = params.get('barber');
      if (preBarber) {
        const bCard = document.querySelector(`.barber-card-premium[data-barber="${preBarber.toLowerCase()}"]`);
        if (bCard) {
          bCard.click();
        }
      }

      // On success "Cerrar" — redirect to site
      window.closeBookingModal = function() {
        window.location.href = 'index.html';
      };
    });
  </script>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/573001234567" target="_blank" class="floating-wa" aria-label="Contactar por WhatsApp">
    <svg viewBox="0 0 24 24">
      <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.665.592 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.029 18.88c-1.161 0-2.305-.292-3.318-.844l-3.677.964.984-3.595c-.607-1.052-.927-2.246-.926-3.468.001-3.825 3.113-6.937 6.937-6.937 1.856.001 3.598.723 4.907 2.034 1.31 1.311 2.031 3.054 2.03 4.908-.001 3.825-3.113 6.938-6.937 6.938z"/>
    </svg>
    <span>WhatsApp</span>
  </a>

</body>
</html>
