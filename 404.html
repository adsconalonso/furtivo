<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Furtivo Barbería</title>
  <meta name="robots" content="noindex">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css?v=FINAL2">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">

  <style>
    /* Standalone 404 layout */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0a0a0a;
      font-family: var(--font-sans, 'Inter', sans-serif);
      color: #eee;
      display: flex;
      flex-direction: column;
    }

    /* Background grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .error-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .error-code {
      font-family: 'Playfair Display', serif;
      font-size: 8rem;
      font-weight: 700;
      color: #C9A96E;
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 0 10px 30px rgba(201, 169, 110, 0.2);
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #fff;
      margin-bottom: 1rem;
    }

    .error-text {
      color: #aaa;
      font-size: 1.1rem;
      max-width: 500px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #C9A96E;
      color: #0a0a0a;
      padding: 1rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .btn-home:hover {
      background: #e0bc7a;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(201, 169, 110, 0.3);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      position: absolute;
      top: 2rem;
      left: 2rem;
      z-index: 2;
    }
    .logo span { color: #C9A96E; }

    @media (max-width: 600px) {
      .error-code { font-size: 6rem; }
      .error-title { font-size: 2rem; }
      .logo { top: 1.5rem; left: 1.5rem; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="logo"><img src="assets/images/furtivo-logo-oficial.png?v=FINAL" alt="Furtivo Barbería"></a>

  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-text">Parece que te has desviado del camino. La página que buscas no existe o ha sido movida.</p>
    <a href="index.html" class="btn-home">Volver al inicio</a>
  </div>

</body>
</html>
